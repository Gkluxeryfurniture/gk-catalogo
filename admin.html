<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Panel — G&K Luxury Furniture</title>
<style>
:root{--bg:#16130f;--sf:#201b15;--line:#3a3024;--gold:#ff8b00;--ink:#f5efe6;--muted:#a89a86;--bad:#e5484d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:16px;max-width:720px;margin:auto}
h1{font-size:20px;margin:8px 0 16px}h2{font-size:16px;margin:0 0 12px}
.box{background:var(--sf);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:16px}
input,textarea,select{width:100%;padding:11px;margin:0 0 10px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;font:inherit}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
button{background:var(--gold);color:#16130f;border:0;border-radius:8px;padding:11px 14px;font-weight:700;font:inherit;font-weight:700;cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.del{background:transparent;color:var(--bad);border:1px solid var(--bad)}
button:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap}
.item{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.item img{width:60px;height:60px;object-fit:cover;border-radius:8px;background:var(--bg)}
.item .t{flex:1;min-width:0}.item .n{font-weight:600}.item .p{color:var(--gold);font-size:14px}
.off{opacity:.45}
#msg{position:fixed;left:12px;right:12px;bottom:12px;background:var(--sf);border:1px solid var(--gold);padding:12px;border-radius:10px;display:none;text-align:center}
#prev{max-width:100%;max-height:180px;border-radius:8px;display:none;margin-bottom:10px}
.hide{display:none}
</style>
</head>
<body>
<h1>Panel de productos — G&amp;K Luxury Furniture</h1>

<div id="login" class="box">
  <h2>Entrar</h2>
  <label>Correo</label><input id="em" type="email" autocomplete="username">
  <label>Clave</label><input id="pw" type="password" autocomplete="current-password">
  <button id="btnLogin">Entrar</button>
</div>

<div id="app" class="hide">
  <div class="box">
    <h2 id="formTitle">Agregar producto</h2>
    <label>Foto</label>
    <img id="prev" alt="">
    <input id="file" type="file" accept="image/*">
    <label>Nombre</label><input id="name" placeholder="Ej: Sala Gala">
    <label>Precio (COP, solo números)</label><input id="price" inputmode="numeric" placeholder="1880000">
    <label>Descripción (opcional)</label><textarea id="desc" rows="2"></textarea>
    <div class="row">
      <button id="btnSave">Guardar producto</button>
      <button id="btnCancel" class="ghost hide">Cancelar edición</button>
    </div>
  </div>

  <div class="box">
    <h2>Mis productos <span id="count" style="color:var(--muted);font-weight:400"></span></h2>
    <div id="list"></div>
    <div class="row" style="margin-top:12px">
      <button id="btnImport" class="ghost">Importar los productos actuales del catálogo</button>
      <button id="btnOut" class="ghost">Cerrar sesión</button>
    </div>
  </div>
</div>
<div id="msg"></div>

<script>
const SB_URL='https://smkwmtrjgxpxhcvujnlh.supabase.co';
const SB_KEY='sb_publishable_s_z3_STFixVx8bp660e78g_LUvwCY4O';
const $=id=>document.getElementById(id);
let token=null, editId=null, editImg=null, rows=[];

function msg(t){const m=$('msg');m.textContent=t;m.style.display='block';clearTimeout(msg.t);msg.t=setTimeout(()=>m.style.display='none',3500)}
const H=(extra={})=>({apikey:SB_KEY,Authorization:'Bearer '+token,...extra});
const fmt=n=>'$'+Number(n).toLocaleString('es-CO');

async function login(){
  const r=await fetch(SB_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:$('em').value.trim(),password:$('pw').value})});
  const d=await r.json();
  if(!r.ok){msg('Correo o clave incorrectos');return}
  token=d.access_token;
  try{localStorage.setItem('gk_rt',d.refresh_token)}catch(e){}
  start();
}
async function tryRefresh(){
  let rt=null;try{rt=localStorage.getItem('gk_rt')}catch(e){}
  if(!rt)return;
  const r=await fetch(SB_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:rt})});
  if(!r.ok)return;
  const d=await r.json();token=d.access_token;
  try{localStorage.setItem('gk_rt',d.refresh_token)}catch(e){}
  start();
}
function start(){$('login').classList.add('hide');$('app').classList.remove('hide');load()}
function logout(){try{localStorage.removeItem('gk_rt')}catch(e){}location.reload()}

async function load(){
  const r=await fetch(SB_URL+'/rest/v1/products?select=*&order=created_at.desc',{headers:H()});
  if(r.status===401){msg('Sesión vencida, entra de nuevo');logout();return}
  rows=await r.json();
  $('count').textContent='('+rows.length+')';
  $('list').innerHTML=rows.length?rows.map(p=>`
    <div class="item ${p.active?'':'off'}">
      <img src="${p.image_url||''}" alt="">
      <div class="t"><div class="n">${esc(p.name)}</div><div class="p">${fmt(p.price)}${p.active?'':' · oculto'}</div></div>
      <div class="row">
        <button class="ghost" onclick="edit(${p.id})">Editar</button>
        <button class="ghost" onclick="toggle(${p.id})">${p.active?'Ocultar':'Mostrar'}</button>
        <button class="del" onclick="del(${p.id})">Borrar</button>
      </div>
    </div>`).join(''):'<p style="color:var(--muted)">Aún no tienes productos cargados. Agrega el primero arriba o importa los actuales.</p>';
}
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function compress(file,max=1100){
  return new Promise((res,rej)=>{
    const img=new Image();img.onload=()=>{
      const k=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      c.toBlob(b=>b?res(b):rej(),'image/jpeg',0.85);
    };img.onerror=rej;img.src=URL.createObjectURL(file);
  });
}
async function upload(blob){
  const name=Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.jpg';
  const r=await fetch(SB_URL+'/storage/v1/object/productos/'+name,{method:'POST',headers:H({'Content-Type':'image/jpeg'}),body:blob});
  if(!r.ok)throw new Error('No se pudo subir la foto');
  return SB_URL+'/storage/v1/object/public/productos/'+name;
}

$('file').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  $('prev').src=URL.createObjectURL(f);$('prev').style.display='block';
});

async function save(){
  const name=$('name').value.trim(),price=Number($('price').value.replace(/\D/g,''));
  const f=$('file').files[0];
  if(!name||!price){msg('Escribe el nombre y el precio');return}
  if(!f&&!editId){msg('Elige una foto');return}
  $('btnSave').disabled=true;
  try{
    let url=editImg;
    if(f)url=await upload(await compress(f));
    const body={name,price,description:$('desc').value.trim(),image_url:url};
    const r=editId
      ?await fetch(SB_URL+'/rest/v1/products?id=eq.'+editId,{method:'PATCH',headers:H({'Content-Type':'application/json',Prefer:'return=minimal'}),body:JSON.stringify(body)})
      :await fetch(SB_URL+'/rest/v1/products',{method:'POST',headers:H({'Content-Type':'application/json',Prefer:'return=minimal'}),body:JSON.stringify(body)});
    if(!r.ok)throw new Error('No se pudo guardar');
    msg(editId?'Producto actualizado':'Producto agregado');
    reset();load();
  }catch(e){msg(e.message||'Error')}
  $('btnSave').disabled=false;
}
function reset(){
  editId=null;editImg=null;
  ['name','price','desc'].forEach(i=>$(i).value='');
  $('file').value='';$('prev').style.display='none';
  $('formTitle').textContent='Agregar producto';$('btnCancel').classList.add('hide');
}
function edit(id){
  const p=rows.find(x=>x.id===id);if(!p)return;
  editId=id;editImg=p.image_url;
  $('name').value=p.name;$('price').value=p.price;$('desc').value=p.description||'';
  $('prev').src=p.image_url||'';$('prev').style.display=p.image_url?'block':'none';
  $('formTitle').textContent='Editando: '+p.name;$('btnCancel').classList.remove('hide');
  scrollTo({top:0,behavior:'smooth'});
}
async function toggle(id){
  const p=rows.find(x=>x.id===id);
  await fetch(SB_URL+'/rest/v1/products?id=eq.'+id,{method:'PATCH',headers:H({'Content-Type':'application/json',Prefer:'return=minimal'}),body:JSON.stringify({active:!p.active})});
  load();
}
async function del(id){
  if(!confirm('¿Borrar este producto?'))return;
  await fetch(SB_URL+'/rest/v1/products?id=eq.'+id,{method:'DELETE',headers:H()});
  msg('Producto borrado');load();
}

async function importOld(){
  if(!confirm('Esto sube los productos que ya tiene el catálogo a la base de datos. ¿Continuar?'))return;
  $('btnImport').disabled=true;
  try{
    const txt=await (await fetch('index.html')).text();
    const m=txt.match(/const FALLBACK = (\[[\s\S]*?\n\]);/);
    if(!m)throw new Error('No encontré los productos');
    const list=new Function('return '+m[1])();
    let n=0;
    for(const p of list){
      msg('Importando '+(++n)+' de '+list.length+'...');
      const blob=await (await fetch(p.img)).blob();
      const url=await upload(blob);
      await fetch(SB_URL+'/rest/v1/products',{method:'POST',headers:H({'Content-Type':'application/json',Prefer:'return=minimal'}),body:JSON.stringify({name:p.name,price:p.price,image_url:url})});
    }
    msg('Listo, '+list.length+' productos importados');load();
  }catch(e){msg(e.message||'Error al importar')}
  $('btnImport').disabled=false;
}

$('btnLogin').onclick=login;$('btnSave').onclick=save;$('btnCancel').onclick=reset;
$('btnImport').onclick=importOld;$('btnOut').onclick=logout;
$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
tryRefresh();
</script>
</body>
</html>
